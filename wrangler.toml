name = "prompt-template"
main = "src/index.ts"
compatibility_date = "2025-05-13"

assets = { directory = "public" }

[[d1_databases]]
binding = "DB"
database_name = "prompt-template-db"
# 以下を実DBのIDに書き換え:
#   npx wrangler d1 create prompt-template-db
database_id = "00000000-0000-0000-0000-000000000000"

# デプロイ前に secret として設定:
#   echo "＜値＞" | npx wrangler secret put SESSION_SECRET
#   echo "＜値＞" | npx wrangler secret put GOOGLE_CLIENT_ID
#   echo "＜値＞" | npx wrangler secret put GOOGLE_CLIENT_SECRET
#   echo "＜値＞" | npx wrangler secret put GOOGLE_REDIRECT_URI
